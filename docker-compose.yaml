# VerifierPlus for Coolify
# - Coolify's proxy handles domains and HTTPS, so nginx-proxy / acme-companion are gone.
# - In Coolify: set the verifier-plus domain (port 3000) and the PUBLIC_URL variable to the same https:// URL.
# - MongoDB runs alongside; set MONGODB_URI yourself instead if you use Atlas.
 
services:
  verifier-plus:
    build:
      context: .
      args:
        # Inlined into the browser bundle at build time: redeploy after changing it
        NEXT_PUBLIC_EXCHANGE_SERVER_URL: ${PUBLIC_URL}
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_VERIFIERPLUS_3000
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # Bundled MongoDB below. For Atlas, replace with your mongodb+srv:// string.
      - MONGODB_URI=mongodb://${SERVICE_USER_MONGO}:${SERVICE_PASSWORD_MONGO}@mongo:27017/?authSource=admin
      - DB_NAME=${DB_NAME:-verifier-plus}
      - DB_COLLECTION=${DB_COLLECTION:-credentials}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # Cheap liveness check. /api/healthz writes a test credential to Mongo on every call,
      # which is too heavy to run every 30 seconds.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
 
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${SERVICE_USER_MONGO}
      - MONGO_INITDB_ROOT_PASSWORD=${SERVICE_PASSWORD_MONGO}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
volumes:
  mongo-data:
 
